<div data-th-fragment="contact">
  <!-- View contact modal -->
  <div
    id="view_contact_modal"
    tabindex="-1"
    aria-hidden="true"
    class="hidden fixed inset-0 z-50 justify-center items-center w-full h-full overflow-y-auto overflow-x-hidden"
  >
    <div class="relative w-full max-w-md mx-auto my-8 px-4">
      <!-- card -->
      <div class="relative bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-100 dark:border-gray-700 overflow-hidden">
        <!-- close -->
        <button
          type="button"
          onclick="closeContactModal()"
          class="absolute top-3 right-3 z-10 w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:text-gray-700 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
        >
          <i class="fa-solid fa-xmark"></i>
          <span class="sr-only">Close</span>
        </button>

        <!-- header -->
        <div class="flex flex-col items-center text-center px-6 pt-8 pb-6 bg-gradient-to-b from-indigo-50 to-white dark:from-gray-700/40 dark:to-gray-800">
          <img
            onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Contact&background=E0E7FF&color=4F46E5&size=128'"
            id="contact_image"
            class="w-24 h-24 rounded-full object-cover ring-4 ring-white dark:ring-gray-800 shadow-md"
            src=""
            alt=""
          />
          <h3 id="contact_name" class="mt-4 text-xl font-bold text-gray-900 dark:text-white"></h3>
          <p id="contact_email" class="text-sm text-gray-500 dark:text-gray-400"></p>
          <p id="contact_favorite" class="mt-2 text-xs font-medium text-amber-500"></p>
        </div>

        <!-- details -->
        <div class="px-6 py-5 space-y-1">
          <div class="flex items-center gap-3 py-2.5 border-b border-gray-100 dark:border-gray-700">
            <span class="w-9 h-9 shrink-0 rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-gray-500 dark:text-gray-300"><i class="fa-solid fa-phone"></i></span>
            <span id="contact_phone" class="text-sm text-gray-700 dark:text-gray-200"></span>
          </div>
          <div class="flex items-center gap-3 py-2.5 border-b border-gray-100 dark:border-gray-700">
            <span class="w-9 h-9 shrink-0 rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-gray-500 dark:text-gray-300"><i class="fa-solid fa-location-dot"></i></span>
            <span id="contact_address" class="text-sm text-gray-700 dark:text-gray-200 break-words"></span>
          </div>
          <div class="flex items-center gap-3 py-2.5 border-b border-gray-100 dark:border-gray-700">
            <span class="w-9 h-9 shrink-0 rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-gray-500 dark:text-gray-300"><i class="fa-solid fa-circle-info"></i></span>
            <span id="contact_about" class="text-sm text-gray-700 dark:text-gray-200 break-words"></span>
          </div>
          <div class="flex items-center gap-3 py-2.5 border-b border-gray-100 dark:border-gray-700">
            <span class="w-9 h-9 shrink-0 rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-gray-500 dark:text-gray-300"><i class="fa-solid fa-earth-americas"></i></span>
            <a id="contact_website" href="#" target="_blank" class="text-sm text-indigo-600 dark:text-indigo-400 hover:underline break-all"></a>
          </div>
          <div class="flex items-center gap-3 py-2.5">
            <span class="w-9 h-9 shrink-0 rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-gray-500 dark:text-gray-300"><i class="fa-brands fa-linkedin-in"></i></span>
            <a id="contact_linkedIn" href="#" target="_blank" class="text-sm text-indigo-600 dark:text-indigo-400 hover:underline break-all"></a>
          </div>
        </div>

        <!-- footer -->
        <div class="px-6 py-4 bg-gray-50 dark:bg-gray-800/60 border-t border-gray-100 dark:border-gray-700 flex justify-end">
          <button
            onclick="closeContactModal()"
            type="button"
            class="inline-flex items-center gap-2 rounded-lg bg-gray-900 dark:bg-gray-700 hover:bg-gray-800 dark:hover:bg-gray-600 text-white text-sm font-medium px-4 py-2 transition-colors"
          >
            Close
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
