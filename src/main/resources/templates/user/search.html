<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}"
>
  <head>
    <title>Search · SCM 2.0</title>
  </head>
  <body>
    <div id="content">
      <div th:if="${loggedInUser}">
        <div data-th-replace="~{user/sidebar :: sidebar}"></div>
      </div>

      <main class="sm:pl-64 pt-16 min-h-screen bg-gray-50 dark:bg-gray-950">
        <div class="max-w-6xl mx-auto px-4 sm:px-8 py-8">
          <!-- Page header -->
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <div>
              <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Search results</h1>
              <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                <span data-th-text="${pageContact.totalElements}">0</span> contact(s) found.
              </p>
            </div>
            <a data-th-href="@{'/user/contacts'}"
               class="inline-flex items-center gap-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 text-sm font-medium px-4 py-2.5 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
              <i class="fa-solid fa-arrow-left"></i> All contacts
            </a>
          </div>

          <!-- Search bar (prefilled) -->
          <form data-th-object="${contactSearchForm}" data-th-action="@{'/user/contacts/search'}"
                class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm p-4 mb-6">
            <div class="flex flex-col sm:flex-row gap-3">
              <select data-th-field="*{field}"
                      class="rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none sm:w-40">
                <option value="">All fields</option>
                <option value="name">Name</option>
                <option value="phone">Phone</option>
                <option value="email">Email</option>
              </select>
              <div class="relative flex-1">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 pointer-events-none">
                  <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input data-th-field="*{value}" type="text"
                       class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm pl-10 pr-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                       placeholder="Search contacts..." />
              </div>
              <button type="submit"
                      class="inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-5 py-2.5 transition-colors">
                Search
              </button>
            </div>
          </form>

          <!-- Results card -->
          <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 shadow-card overflow-hidden">
            <div class="hidden md:block overflow-x-auto">
              <table data-th-if="${pageContact.totalElements>0}" class="w-full text-sm text-left">
                <thead class="text-xs uppercase text-gray-500 dark:text-gray-400 bg-gray-50 dark:bg-gray-800/50 border-b border-gray-200 dark:border-gray-800">
                  <tr>
                    <th scope="col" class="px-6 py-3 font-semibold">Name</th>
                    <th scope="col" class="px-6 py-3 font-semibold">Phone</th>
                    <th scope="col" class="px-6 py-3 font-semibold">Links</th>
                    <th scope="col" class="px-6 py-3 font-semibold text-right">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
                  <tr data-th-object="${c}" data-th-each="c : ${pageContact.getContent()}"
                      class="hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors">
                    <td class="px-6 py-4">
                      <div class="flex items-center gap-3">
                        <img
                          onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Contact&background=E0E7FF&color=4F46E5&size=64'"
                          class="w-10 h-10 rounded-full object-cover shrink-0"
                          data-th-src="*{picture != null and picture != ''} ? @{*{picture}} : ('https://ui-avatars.com/api/?name=' + *{name} + '&background=E0E7FF&color=4F46E5&size=64')"
                          alt="avatar" />
                        <div class="min-w-0">
                          <div class="font-semibold text-gray-900 dark:text-white truncate" data-th-text="*{name}">Name</div>
                          <div class="text-gray-500 dark:text-gray-400 truncate" data-th-text="*{email}">email</div>
                        </div>
                      </div>
                    </td>
                    <td class="px-6 py-4 text-gray-700 dark:text-gray-300 whitespace-nowrap">
                      <i class="fa-solid fa-phone text-gray-400 mr-1.5"></i>
                      <span data-th-text="*{phoneNumber}"></span>
                    </td>
                    <td class="px-6 py-4">
                      <div class="flex items-center gap-3 text-gray-400">
                        <a data-th-href="@{*{websiteLink}}" target="_blank" class="hover:text-indigo-600 dark:hover:text-indigo-400" title="Website"><i class="fa-solid fa-link"></i></a>
                        <a data-th-href="@{*{linkedInLink}}" target="_blank" class="hover:text-indigo-600 dark:hover:text-indigo-400" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
                      </div>
                    </td>
                    <td class="px-6 py-4">
                      <div class="flex items-center justify-end gap-1">
                        <button type="button" th:onclick="toggleFavorite([[${c.id}]], this)"
                                th:title="${c.favorite} ? 'Remove from favorites' : 'Add to favorites'"
                                class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                          <i th:classappend="${c.favorite} ? 'fa-solid text-amber-400' : 'fa-regular text-gray-400'" class="fa-star"></i>
                        </button>
                        <button type="button" th:onclick="loadContactdata([[${c.id}]])" title="View"
                                class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
                          <i class="fa-solid fa-eye"></i>
                        </button>
                        <a data-th-href="@{'/user/contacts/view/'+*{id}}" title="Edit"
                           class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
                          <i class="fa-solid fa-pen"></i>
                        </a>
                        <button type="button" th:onclick="deleteContact([[${c.id}]])" title="Delete"
                                class="p-2 rounded-lg text-gray-500 hover:bg-red-50 dark:hover:bg-red-900/30 hover:text-red-600 transition-colors">
                          <i class="fa-solid fa-trash"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Mobile cards (shown below md) -->
            <div class="md:hidden divide-y divide-gray-100 dark:divide-gray-800" data-th-if="${pageContact.totalElements>0}">
              <div th:each="c : ${pageContact.getContent()}" class="p-4">
                <div class="flex items-center gap-3">
                  <img
                    onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Contact&background=E0E7FF&color=4F46E5&size=64'"
                    class="w-11 h-11 rounded-full object-cover shrink-0"
                    th:src="${c.picture != null and c.picture != ''} ? ${c.picture} : ('https://ui-avatars.com/api/?name=' + ${c.name} + '&background=E0E7FF&color=4F46E5&size=64')"
                    alt="avatar" />
                  <div class="flex-1 min-w-0">
                    <p class="font-semibold text-gray-900 dark:text-white truncate" th:text="${c.name}">Name</p>
                    <p class="text-sm text-gray-500 dark:text-gray-400 truncate" th:text="${c.email}">email</p>
                  </div>
                  <button type="button" th:onclick="toggleFavorite([[${c.id}]], this)"
                          th:title="${c.favorite} ? 'Remove from favorites' : 'Add to favorites'"
                          class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <i th:classappend="${c.favorite} ? 'fa-solid text-amber-400' : 'fa-regular text-gray-400'" class="fa-star"></i>
                  </button>
                </div>
                <div class="mt-3 flex items-center gap-2 text-sm text-gray-600 dark:text-gray-300">
                  <i class="fa-solid fa-phone text-gray-400"></i>
                  <span th:text="${c.phoneNumber}">phone</span>
                </div>
                <div class="mt-3 flex items-center justify-between border-t border-gray-100 dark:border-gray-800 pt-3">
                  <div class="flex items-center gap-4 text-gray-400">
                    <a th:href="@{${c.websiteLink}}" target="_blank" class="hover:text-indigo-600 dark:hover:text-indigo-400" title="Website"><i class="fa-solid fa-link"></i></a>
                    <a th:href="@{${c.linkedInLink}}" target="_blank" class="hover:text-indigo-600 dark:hover:text-indigo-400" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
                  </div>
                  <div class="flex items-center gap-1">
                    <button type="button" th:onclick="loadContactdata([[${c.id}]])" title="View"
                            class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"><i class="fa-solid fa-eye"></i></button>
                    <a th:href="@{'/user/contacts/view/' + ${c.id}}" title="Edit"
                       class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"><i class="fa-solid fa-pen"></i></a>
                    <button type="button" th:onclick="deleteContact([[${c.id}]])" title="Delete"
                            class="p-2 rounded-lg text-gray-500 hover:bg-red-50 dark:hover:bg-red-900/30 hover:text-red-600 transition-colors"><i class="fa-solid fa-trash"></i></button>
                  </div>
                </div>
              </div>
            </div>

            <!-- empty state -->
            <div data-th-if="${pageContact.totalElements<=0}" class="px-6 py-16 text-center">
              <div class="w-12 h-12 mx-auto rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center mb-3">
                <i class="fa-solid fa-magnifying-glass text-xl text-gray-400"></i>
              </div>
              <p class="text-sm text-gray-500 dark:text-gray-400">No contacts matched your search.</p>
              <a data-th-href="@{'/user/contacts'}" class="inline-block mt-2 text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:underline">Back to all contacts</a>
            </div>

            <!-- pagination -->
            <div data-th-if="${pageContact.totalElements>0}"
                 class="flex items-center justify-center gap-1 px-6 py-4 border-t border-gray-100 dark:border-gray-800">
              <a data-th-unless="${pageContact.first}"
                 data-th-href="@{'/user/contacts/search?size='+${pageSize}+'&page='+${pageContact.number-1}+'&field='+${contactSearchForm.field}+'&value='+${contactSearchForm.value}}"
                 class="px-3 h-9 inline-flex items-center rounded-lg text-sm text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800">
                <i class="fa-solid fa-chevron-left"></i>
              </a>
              <a data-th-each="index : ${#numbers.sequence(0,pageContact.totalPages-1)}"
                 data-th-href="@{'/user/contacts/search?size='+${pageSize}+'&page='+${index}+'&field='+${contactSearchForm.field}+'&value='+${contactSearchForm.value}}"
                 data-th-classappend="${index==pageContact.number} ? 'bg-indigo-600 text-white' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800'"
                 class="w-9 h-9 inline-flex items-center justify-center rounded-lg text-sm font-medium">
                <span data-th-text="${index+1}"></span>
              </a>
              <a data-th-unless="${pageContact.last}"
                 data-th-href="@{'/user/contacts/search?size='+${pageSize}+'&page='+${pageContact.number+1}+'&field='+${contactSearchForm.field}+'&value='+${contactSearchForm.value}}"
                 class="px-3 h-9 inline-flex items-center rounded-lg text-sm text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800">
                <i class="fa-solid fa-chevron-right"></i>
              </a>
            </div>
          </div>
        </div>

        <div data-th-replace="~{user/contact_modals :: contact}"></div>
      </main>
    </div>

    <script data-th-src="@{'/js/contacts.js'}"></script>
  </body>
</html>
