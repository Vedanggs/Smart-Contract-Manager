<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}"
>
  <head>
    <title data-th-text="${loggedInUser.name}+' · Profile'">Profile</title>
  </head>
  <body>
    <div id="content">
      <div th:if="${loggedInUser}">
        <div data-th-replace="~{user/sidebar :: sidebar}"></div>
      </div>

      <main class="sm:pl-64 pt-16 min-h-screen bg-gray-50 dark:bg-gray-950">
        <div class="max-w-2xl mx-auto px-4 sm:px-8 py-8">
          <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Profile</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Manage your personal information and photo.</p>
          </div>

          <div data-th-replace="~{message :: messagebox}"></div>

          <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-card">
            <form id="profileForm" th:action="@{/user/profile/update}" method="POST" enctype="multipart/form-data">
              <!-- Photo -->
              <div class="flex flex-col items-center px-6 pt-8 pb-6 border-b border-gray-100 dark:border-gray-800">
                <div class="relative">
                  <div id="photoPreview" class="w-28 h-28 rounded-full overflow-hidden bg-gray-100 dark:bg-gray-800 flex items-center justify-center ring-4 ring-white dark:ring-gray-800 shadow">
                    <img id="currentPhoto" data-th-src="@{${loggedInUser.profilePic}}" src="" alt="Profile" class="w-full h-full object-cover" th:if="${loggedInUser.profilePic != null and loggedInUser.profilePic != ''}">
                    <i id="defaultIcon" class="fa-solid fa-user text-4xl text-gray-400" th:if="${loggedInUser.profilePic == null or loggedInUser.profilePic == ''}"></i>
                  </div>
                  <label for="profilePhoto" class="absolute bottom-0 right-0 w-9 h-9 flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white rounded-full cursor-pointer shadow-md transition-colors">
                    <i class="fa-solid fa-camera text-sm"></i>
                  </label>
                  <input type="file" id="profilePhoto" name="profilePhoto" accept="image/*" class="hidden" onchange="previewPhoto(this)">
                </div>
                <p class="text-xs text-gray-400 mt-3">Click the camera to upload a new photo</p>
              </div>

              <div class="px-6 py-6 space-y-5">
                <!-- Name -->
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1.5">Full name</label>
                  <input type="text" name="name" data-th-value="${loggedInUser.name}" readonly
                         class="w-full rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 text-sm px-3 py-2.5 cursor-not-allowed" />
                </div>

                <!-- Email -->
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1.5">Email address</label>
                  <input type="email" id="email" name="email" data-th-value="${loggedInUser.email}"
                         class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
                </div>

                <!-- Phone -->
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1.5">Phone number</label>
                  <input type="tel" id="phoneNumber" name="phoneNumber" data-th-value="${loggedInUser.phoneNumber}"
                         class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
                </div>

                <!-- About -->
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1.5">About</label>
                  <textarea name="about" rows="3" data-th-text="${loggedInUser.about}"
                            class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none"
                            placeholder="Tell us about yourself..."></textarea>
                </div>
              </div>

              <!-- Actions -->
              <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100 dark:border-gray-800">
                <button type="button" onclick="window.location.reload()"
                        class="rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 text-sm font-medium px-4 py-2.5 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                  Cancel
                </button>
                <button type="submit"
                        class="inline-flex items-center gap-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-5 py-2.5 shadow-sm transition-colors">
                  <i class="fa-solid fa-floppy-disk"></i> Save changes
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>

    <script>
      function previewPhoto(input) {
        if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = function (e) {
            document.getElementById("photoPreview").innerHTML =
              '<img src="' + e.target.result + '" class="w-full h-full object-cover">';
          };
          reader.readAsDataURL(input.files[0]);
        }
      }
    </script>
  </body>
</html>
