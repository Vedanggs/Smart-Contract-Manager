<aside
  data-th-fragment="sidebar"
  id="logo-sidebar"
  class="fixed top-0 left-0 z-40 w-64 h-screen -translate-x-full sm:translate-x-0 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800"
  aria-label="Sidebar"
>
  <div class="h-full flex flex-col overflow-y-auto overflow-x-hidden">
    <!-- Brand + collapse -->
    <div class="nav-brand flex items-center justify-between px-4 h-16 border-b border-gray-200 dark:border-gray-800">
      <a data-th-href="@{'/user/dashboard'}" class="nav-brand-logo flex items-center gap-2 min-w-0">
        <i class="fa-solid fa-address-book text-indigo-600 text-xl shrink-0"></i>
        <span class="nav-text text-lg font-bold text-gray-900 dark:text-white whitespace-nowrap">SCM 2.0</span>
      </a>
      <button
        id="sidebarCollapseBtn"
        type="button"
        aria-label="Toggle sidebar"
        class="nav-collapse-btn hidden sm:flex w-8 h-8 items-center justify-center rounded-lg text-gray-400 hover:text-gray-700 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
      >
        <i class="fa-solid fa-angles-left nav-collapse-icon transition-transform"></i>
      </button>
    </div>

    <!-- User card -->
    <a
      data-th-href="@{'/user/profile'}"
      class="nav-user flex items-center gap-3 mx-3 mt-4 mb-2 p-3 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors"
    >
      <img
        onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=User&background=4F46E5&color=fff&size=96'"
        data-th-src="${loggedInUser.profilePic != null and loggedInUser.profilePic != ''} ? @{${loggedInUser.profilePic}} : ('https://ui-avatars.com/api/?name=' + ${loggedInUser.name} + '&background=4F46E5&color=fff&size=96')"
        class="w-11 h-11 rounded-full object-cover ring-2 ring-white dark:ring-gray-800 shadow shrink-0"
        alt="Profile"
      />
      <div class="nav-text min-w-0">
        <p class="text-sm font-semibold text-gray-900 dark:text-white truncate" data-th-text="${loggedInUser.name}">User</p>
        <p class="text-xs text-gray-500 dark:text-gray-400 truncate" data-th-text="${loggedInUser.email}">email</p>
      </div>
    </a>

    <!-- Nav -->
    <nav class="flex-1 px-3 py-2 space-y-1" id="sidebarNav">
      <a data-th-href="@{'/user/dashboard'}" title="Dashboard"
         class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-all duration-300">
        <i class="fa-solid fa-gauge-high w-5 text-center shrink-0"></i><span class="nav-text whitespace-nowrap">Dashboard</span>
      </a>
      <a data-th-href="@{'/user/contacts'}" title="Contacts"
         class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-all duration-300">
        <i class="fa-regular fa-address-book w-5 text-center shrink-0"></i><span class="nav-text whitespace-nowrap">Contacts</span>
      </a>
      <a data-th-href="@{'/user/contacts/add'}" title="Add Contact"
         class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-all duration-300">
        <i class="fa-solid fa-plus w-5 text-center shrink-0"></i><span class="nav-text whitespace-nowrap">Add Contact</span>
      </a>
      <a data-th-href="@{'/user/direct-message'}" title="Messages"
         class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-all duration-300">
        <i class="fa-regular fa-paper-plane w-5 text-center shrink-0"></i><span class="nav-text whitespace-nowrap">Messages</span>
      </a>
      <a data-th-href="@{'/user/profile'}" title="Profile"
         class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-all duration-300">
        <i class="fa-regular fa-user w-5 text-center shrink-0"></i><span class="nav-text whitespace-nowrap">Profile</span>
      </a>
      <a data-th-href="@{'/user/feedback'}" title="Feedback"
         class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-all duration-300">
        <i class="fa-regular fa-comment-dots w-5 text-center shrink-0"></i><span class="nav-text whitespace-nowrap">Feedback</span>
      </a>
    </nav>

    <!-- Logout -->
    <div class="px-3 py-4 border-t border-gray-200 dark:border-gray-800">
      <a data-th-href="@{'/do-logout'}" title="Logout"
         class="nav-logout flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30 transition-all duration-300">
        <i class="fa-solid fa-right-from-bracket w-5 text-center shrink-0"></i><span class="nav-text whitespace-nowrap">Logout</span>
      </a>
    </div>
  </div>

  <script>
    (function () {
      // Active nav item
      var path = window.location.pathname;
      var links = document.querySelectorAll("#sidebarNav .nav-link");
      var best = null, bestLen = -1;
      links.forEach(function (a) {
        var href = a.getAttribute("href");
        if (!href) return;
        if (path === href || path.indexOf(href) === 0) {
          if (href.length > bestLen) { best = a; bestLen = href.length; }
        }
      });
      if (best) {
        best.classList.remove("text-gray-700", "dark:text-gray-300");
        best.classList.add("bg-indigo-50", "dark:bg-indigo-500/10", "text-indigo-700", "dark:text-indigo-300");
      }

      // Collapse toggle (desktop)
      var btn = document.getElementById("sidebarCollapseBtn");
      if (btn) {
        btn.addEventListener("click", function () {
          var collapsed = document.documentElement.classList.toggle("sidebar-collapsed");
          try { localStorage.setItem("sidebar-collapsed", collapsed ? "1" : "0"); } catch (e) {}
        });
      }
    })();
  </script>
</aside>
