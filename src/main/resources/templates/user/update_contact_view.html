<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}"
>
  <head>
    <title>Edit Contact · SCM 2.0</title>
  </head>
  <body>
    <div id="content">
      <div th:if="${loggedInUser}">
        <div data-th-replace="~{user/sidebar :: sidebar}"></div>
      </div>

      <main class="sm:pl-64 pt-16 min-h-screen bg-gray-50 dark:bg-gray-950">
        <div class="max-w-2xl mx-auto px-4 sm:px-8 py-8">
          <div class="flex items-center justify-between mb-6">
            <div>
              <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Edit contact</h1>
              <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Update this contact's details.</p>
            </div>
            <a data-th-href="@{'/user/contacts'}"
               class="inline-flex items-center gap-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 text-sm font-medium px-4 py-2.5 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
              <i class="fa-solid fa-arrow-left"></i> Back
            </a>
          </div>

          <div data-th-replace="~{message :: messagebox}"></div>

          <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm">
            <form data-th-action="@{'/user/contacts/update/' + ${contactId}}" data-th-object="${contactForm}" method="post" enctype="multipart/form-data">
              <div class="p-6 space-y-5">
                <!-- name + email -->
                <div class="grid sm:grid-cols-2 gap-5">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1.5">Name</label>
                    <div class="relative">
                      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 pointer-events-none"><i class="fa-regular fa-user"></i></span>
                      <input data-th-field="*{name}" type="text" placeholder="Contact name"
                             class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm pl-10 pr-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
                    </div>
                    <p class="text-red-500 text-xs mt-1" data-th-if="${#fields.hasErrors('name')}" data-th-errors="*{name}"></p>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1.5">Email</label>
                    <div class="relative">
                      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 pointer-events-none"><i class="fa-regular fa-envelope"></i></span>
                      <input data-th-field="*{email}" type="text" placeholder="example@gmail.com"
                             class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm pl-10 pr-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
                    </div>
                    <p class="text-red-500 text-xs mt-1" data-th-if="${#fields.hasErrors('email')}" data-th-errors="*{email}"></p>
                  </div>
                </div>

                <!-- phone -->
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1.5">Phone</label>
                  <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 pointer-events-none"><i class="fa-solid fa-phone"></i></span>
                    <input data-th-field="*{phoneNumber}" type="text" placeholder="9876543210"
                           class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm pl-10 pr-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
                  </div>
                  <p class="text-red-500 text-xs mt-1" data-th-if="${#fields.hasErrors('phoneNumber')}" data-th-errors="*{phoneNumber}"></p>
                </div>

                <!-- address -->
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1.5">Address</label>
                  <textarea data-th-field="*{address}" rows="2" placeholder="Address of the contact"
                            class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none"></textarea>
                </div>

                <!-- description -->
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1.5">Description</label>
                  <textarea data-th-field="*{description}" rows="3" placeholder="Write about your contact"
                            class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none"></textarea>
                </div>

                <!-- social links -->
                <div class="grid sm:grid-cols-2 gap-5">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1.5">Website</label>
                    <div class="relative">
                      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 pointer-events-none"><i class="fa-solid fa-earth-americas"></i></span>
                      <input data-th-field="*{websiteLink}" type="text" placeholder="https://example.com"
                             class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm pl-10 pr-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
                    </div>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1.5">LinkedIn</label>
                    <div class="relative">
                      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 pointer-events-none"><i class="fa-brands fa-linkedin"></i></span>
                      <input data-th-field="*{linkedInLink}" type="text" placeholder="https://linkedin.com/in/..."
                             class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm pl-10 pr-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
                    </div>
                  </div>
                </div>

                <!-- image -->
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1.5">Contact image</label>
                  <input id="image_file_input" data-th-field="*{contactImage}" type="file"
                         class="block w-full text-sm text-gray-500 dark:text-gray-400 border border-gray-300 dark:border-gray-700 rounded-lg cursor-pointer bg-gray-50 dark:bg-gray-800 file:mr-3 file:border-0 file:bg-indigo-600 file:text-white file:px-4 file:py-2.5 file:cursor-pointer hover:file:bg-indigo-700" />
                  <p class="text-red-500 text-xs mt-1" data-th-if="${#fields.hasErrors('contactImage')}" data-th-errors="*{contactImage}"></p>
                  <img data-th-src="*{picture}" class="max-h-40 mx-auto rounded-lg shadow mt-3" id="upload_image_preview" alt="Current image" />
                </div>

                <!-- favorite -->
                <label class="flex items-center gap-3 p-3 rounded-lg border border-gray-200 dark:border-gray-700 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                  <input data-th-field="*{favorite}" type="checkbox" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-gray-300 dark:border-gray-600 dark:bg-gray-800" />
                  <span class="text-sm text-gray-700 dark:text-gray-200">Mark this contact as a favorite</span>
                </label>
              </div>

              <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100 dark:border-gray-800">
                <a data-th-href="@{'/user/contacts'}"
                   class="rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 text-sm font-medium px-4 py-2.5 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                  Cancel
                </a>
                <button type="submit"
                        class="inline-flex items-center gap-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-5 py-2.5 shadow-sm transition-colors">
                  <i class="fa-solid fa-floppy-disk"></i> Update contact
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>

    <script data-th-src="@{'/js/admin.js'}"></script>
  </body>
</html>
