<nav
  th:fragment="user-navbar"
  id="app-topbar"
  class="bg-white/80 dark:bg-gray-900/80 backdrop-blur border-b border-gray-200 dark:border-gray-800 sm:pl-64 fixed w-full top-0 left-0 right-0 z-30"
>
  <div class="flex items-center justify-between h-16 px-4 sm:px-6">
    <!-- left: mobile menu button + brand (mobile only) -->
    <div class="flex items-center gap-3">
      <button
        data-drawer-target="logo-sidebar"
        data-drawer-toggle="logo-sidebar"
        aria-controls="logo-sidebar"
        type="button"
        class="inline-flex items-center p-2 text-gray-500 rounded-lg sm:hidden hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 focus:outline-none"
      >
        <span class="sr-only">Open sidebar</span>
        <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20">
          <path
            clip-rule="evenodd"
            fill-rule="evenodd"
            d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"
          ></path>
        </svg>
      </button>
      <a data-th-href="@{'/user/dashboard'}" class="flex items-center gap-2 sm:hidden">
        <i class="fa-solid fa-address-book text-indigo-600 text-lg"></i>
        <span class="font-semibold text-gray-900 dark:text-white">SCM 2.0</span>
      </a>
    </div>

    <!-- right: theme toggle + user chip -->
    <div class="flex items-center gap-3">
      <button
        id="theme_change_button"
        class="inline-flex items-center gap-2 text-sm text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 px-3 py-2 rounded-lg transition-colors"
      >
        <i class="fa-solid fa-circle-half-stroke"></i> <span>Dark</span>
      </button>

      <a
        data-th-href="@{'/user/profile'}"
        class="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
      >
        <img
          onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=User&background=4F46E5&color=fff&size=64'"
          data-th-src="${loggedInUser.profilePic != null and loggedInUser.profilePic != ''} ? @{${loggedInUser.profilePic}} : ('https://ui-avatars.com/api/?name=' + ${loggedInUser.name} + '&background=4F46E5&color=fff&size=64')"
          class="w-8 h-8 rounded-full object-cover"
          alt="Profile"
        />
        <span
          class="hidden sm:block text-sm font-medium text-gray-700 dark:text-gray-200 max-w-[10rem] truncate"
          data-th-text="${loggedInUser.name}"
          >User</span
        >
      </a>
    </div>
  </div>
</nav>
