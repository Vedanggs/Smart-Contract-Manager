<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}"
>
  <head>
    <title data-th-text="${loggedInUser.name}+' · Messages'">Messages</title>
  </head>
  <body>
    <div id="content">
      <div th:if="${loggedInUser}">
        <div data-th-replace="~{user/sidebar :: sidebar}"></div>
      </div>

      <main class="sm:pl-64 pt-16 min-h-screen bg-gray-50 dark:bg-gray-950">
        <div class="max-w-6xl mx-auto px-4 sm:px-8 py-8">
          <!-- Header -->
          <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Messages</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Send an email directly to any of your contacts.</p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Contacts list -->
            <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-card">
              <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-800">
                <h2 class="text-base font-semibold text-gray-900 dark:text-white">Your contacts</h2>
              </div>

              <div th:if="${contacts != null and !contacts.isEmpty()}" class="p-3 space-y-1 max-h-[28rem] overflow-y-auto">
                <div th:each="contact : ${contacts}"
                     class="contact-item flex items-center gap-3 p-3 rounded-xl cursor-pointer border border-transparent hover:bg-gray-50 dark:hover:bg-gray-800 hover:border-gray-200 dark:hover:border-gray-700 transition-all duration-300"
                     th:data-contact-id="${contact.id}"
                     th:data-contact-name="${contact.name}"
                     th:data-contact-email="${contact.email}"
                     onclick="selectContact(this)">
                  <img th:src="${contact.picture != null and contact.picture != ''} ? ${contact.picture} : ('https://ui-avatars.com/api/?name=' + ${contact.name} + '&background=E0E7FF&color=4F46E5&size=64')"
                       onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Contact&background=E0E7FF&color=4F46E5&size=64'"
                       class="w-11 h-11 rounded-full object-cover shrink-0" alt="Contact">
                  <div class="flex-1 min-w-0">
                    <p class="font-medium text-gray-900 dark:text-white truncate" th:text="${contact.name}">Name</p>
                    <p class="text-xs text-gray-500 dark:text-gray-400 truncate" th:text="${contact.email}">Email</p>
                  </div>
                  <i th:if="${contact.favorite}" class="fa-solid fa-star text-amber-400"></i>
                </div>
              </div>

              <div th:if="${contacts == null or contacts.isEmpty()}" class="px-5 py-12 text-center">
                <div class="w-12 h-12 mx-auto rounded-2xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center mb-3">
                  <i class="fa-regular fa-address-book text-xl text-gray-400"></i>
                </div>
                <p class="text-sm text-gray-500 dark:text-gray-400">No contacts yet.</p>
                <a href="/user/contacts/add" class="inline-block mt-2 text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:underline">Add a contact first</a>
              </div>
            </div>

            <!-- Compose -->
            <div class="lg:col-span-2 bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-card">
              <div class="px-5 sm:px-6 py-4 border-b border-gray-100 dark:border-gray-800">
                <h2 class="text-base font-semibold text-gray-900 dark:text-white">Compose message</h2>
              </div>

              <form id="messageForm" onsubmit="sendMessage(event)" class="p-5 sm:p-6">
                <!-- Selected contact -->
                <div class="mb-5 p-4 rounded-xl bg-indigo-50 dark:bg-indigo-500/10 border border-indigo-100 dark:border-indigo-500/20" id="selectedContactDisplay">
                  <p class="text-xs font-medium text-indigo-600 dark:text-indigo-300 mb-2">Sending to</p>
                  <div class="flex items-center gap-3">
                    <div id="selectedContactAvatar" class="w-10 h-10 rounded-full bg-white dark:bg-gray-800 flex items-center justify-center text-gray-400 shrink-0">
                      <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="min-w-0">
                      <p id="selectedContactName" class="font-medium text-gray-900 dark:text-white truncate">Select a contact from the list</p>
                      <p id="selectedContactEmail" class="text-sm text-gray-500 dark:text-gray-400 truncate">-</p>
                    </div>
                  </div>
                  <input type="hidden" id="selectedContactId" name="contactId">
                </div>

                <!-- Subject -->
                <div class="mb-4">
                  <label for="messageSubject" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1.5">Subject</label>
                  <input type="text" id="messageSubject" name="subject" required
                         class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                         placeholder="Enter a subject...">
                </div>

                <!-- Body -->
                <div class="mb-4">
                  <label for="messageBody" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1.5">Message</label>
                  <textarea id="messageBody" name="message" rows="6" required
                            class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white text-sm px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none"
                            placeholder="Type your message here..."></textarea>
                </div>

                <div class="mb-5 flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
                  <i class="fa-solid fa-envelope text-indigo-500"></i>
                  Delivered by email to the selected contact.
                </div>

                <div class="flex items-center justify-between">
                  <button type="button" onclick="clearForm()"
                          class="inline-flex items-center gap-1.5 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white transition-colors">
                    <i class="fa-solid fa-eraser"></i> Clear
                  </button>
                  <button type="submit" id="sendBtn"
                          class="inline-flex items-center gap-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-5 py-2.5 shadow-sm transition-all duration-300 disabled:opacity-60 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-paper-plane"></i> Send message
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      console.log("Direct Message page loaded");

      function selectContact(element) {
        const contactId = element.getAttribute('data-contact-id');
        const contactName = element.getAttribute('data-contact-name');
        const contactEmail = element.getAttribute('data-contact-email');
        const contactPicture = element.querySelector('img').src;

        document.getElementById('selectedContactId').value = contactId;
        document.getElementById('selectedContactName').textContent = contactName;
        document.getElementById('selectedContactEmail').textContent = contactEmail;
        document.getElementById('selectedContactAvatar').innerHTML =
          `<img src="${contactPicture}" class="w-10 h-10 rounded-full object-cover">`;

        document.querySelectorAll('.contact-item').forEach(item => {
          item.classList.remove('ring-2', 'ring-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-500/10');
        });
        element.classList.add('ring-2', 'ring-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-500/10');
      }

      async function sendMessage(event) {
        event.preventDefault();
        const contactId = document.getElementById('selectedContactId').value;
        const subject = document.getElementById('messageSubject').value.trim();
        const message = document.getElementById('messageBody').value.trim();

        if (!contactId) {
          Swal.fire({ icon: 'info', title: 'Select a contact', text: 'Please choose a contact from the list first.' });
          return;
        }

        const sendBtn = document.getElementById('sendBtn');
        const originalHtml = sendBtn.innerHTML;
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Sending...';

        try {
          const params = new URLSearchParams({ contactId, subject, message });
          const res = await fetch('/user/direct-message/send', {
            method: 'POST',
            headers: csrfHeaders({ 'Content-Type': 'application/x-www-form-urlencoded' }),
            body: params.toString(),
          });
          const data = await res.json();

          if (res.ok && data.success) {
            Swal.fire({ icon: 'success', title: 'Message sent', text: data.message });
            clearForm();
          } else {
            Swal.fire({ icon: 'error', title: 'Not sent', text: data.message || 'Something went wrong.' });
          }
        } catch (e) {
          Swal.fire({ icon: 'error', title: 'Network error', text: 'Could not reach the server. Please try again.' });
        } finally {
          sendBtn.disabled = false;
          sendBtn.innerHTML = originalHtml;
        }
      }

      function clearForm() {
        document.getElementById('messageForm').reset();
        document.getElementById('selectedContactId').value = '';
        document.getElementById('selectedContactName').textContent = 'Select a contact from the list';
        document.getElementById('selectedContactEmail').textContent = '-';
        document.getElementById('selectedContactAvatar').innerHTML = '<i class="fa-solid fa-user"></i>';
        document.querySelectorAll('.contact-item').forEach(item => {
          item.classList.remove('ring-2', 'ring-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-500/10');
        });
      }
    </script>
  </body>
</html>
