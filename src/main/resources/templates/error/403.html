<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () { try { var e = document.documentElement; var t = localStorage.getItem("theme") || "light"; e.classList.remove("light","dark"); e.classList.add(t); } catch (x) {} })();
    </script>
    <title>Access denied · SCM 2.0</title>
    <link rel="stylesheet" data-th-href="@{/css/output.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html { background:#eef2f6; } html.dark { background:#0b1220; }
      body { font-family:"Inter", ui-sans-serif, system-ui, sans-serif; }
    </style>
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-white">
    <main class="min-h-screen flex items-center justify-center px-4">
      <div class="text-center max-w-md">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-amber-50 dark:bg-amber-500/10 flex items-center justify-center mb-6">
          <i class="fa-solid fa-lock text-2xl text-amber-600 dark:text-amber-400"></i>
        </div>
        <p class="text-6xl font-extrabold tracking-tight">403</p>
        <h1 class="mt-2 text-xl font-semibold text-gray-800 dark:text-gray-100">Access denied</h1>
        <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">You don't have permission to view this page.</p>
        <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
          <a href="/home" class="rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-5 py-2.5 transition-colors">Go home</a>
          <a href="/login" class="rounded-lg border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-200 text-sm font-semibold px-5 py-2.5 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">Sign in</a>
        </div>
      </div>
    </main>
  </body>
</html>
