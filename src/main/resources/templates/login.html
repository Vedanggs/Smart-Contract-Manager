<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}"
>
  <head>
    <title>Login</title>
  </head>
  <body>
    <div id="content">
      <div
        class="relative min-h-[calc(100vh-72px)] flex items-center justify-center px-4 py-10 sm:py-16 overflow-hidden"
      >
        <!-- decorative gradient backdrop for the glass card -->
        <div class="pointer-events-none absolute inset-0 -z-10">
          <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-indigo-400/30 dark:bg-indigo-600/20 blur-3xl"></div>
          <div class="absolute -bottom-24 -right-24 w-96 h-96 rounded-full bg-sky-400/30 dark:bg-violet-600/20 blur-3xl"></div>
        </div>

        <div class="w-full max-w-md">
          <!-- glass card -->
          <div
            class="bg-white/80 dark:bg-gray-900/70 backdrop-blur-xl rounded-2xl shadow-2xl ring-1 ring-white/50 dark:ring-white/10 overflow-hidden"
          >
            <!-- accent bar -->
            <div class="h-1.5 bg-gradient-to-r from-indigo-600 via-indigo-500 to-sky-500"></div>

            <div class="p-6 sm:p-8">
              <!-- brand / header -->
              <div class="flex flex-col items-center text-center mb-6">
                <div
                  class="w-14 h-14 rounded-full bg-blue-600/10 dark:bg-blue-500/20 flex items-center justify-center mb-3"
                >
                  <i class="fa-solid fa-address-book text-2xl text-blue-600 dark:text-blue-400"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
                  Welcome back
                </h1>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                  Sign in to manage your contacts on the cloud
                </p>
              </div>

              <!-- message here -->
              <div data-th-replace="message::messagebox"></div>

              <!-- error / logout alerts -->
              <div
                th:if="${param.error}"
                class="flex items-center gap-2 rounded-lg bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 px-4 py-3 text-sm text-red-700 dark:text-red-300 mb-4"
              >
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>Invalid email or password. Please try again.</span>
              </div>
              <div
                th:if="${param.logout}"
                class="flex items-center gap-2 rounded-lg bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-800 px-4 py-3 text-sm text-green-700 dark:text-green-300 mb-4"
              >
                <i class="fa-solid fa-circle-check"></i>
                <span>You have been logged out.</span>
              </div>

              <!-- login form -->
              <form method="post" data-th-action="@{'/authenticate'}" class="space-y-5">
                <!-- email field -->
                <div>
                  <label
                    for="email"
                    class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-200"
                    >Email address</label
                  >
                  <div class="relative">
                    <span
                      class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 pointer-events-none"
                    >
                      <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input
                      name="email"
                      type="email"
                      id="email"
                      autocomplete="email"
                      class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white text-sm pl-10 pr-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                      placeholder="you@example.com"
                      required
                    />
                  </div>
                </div>

                <!-- password field -->
                <div>
                  <label
                    for="password"
                    class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-200"
                    >Password</label
                  >
                  <div class="relative">
                    <span
                      class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 pointer-events-none"
                    >
                      <i class="fa-solid fa-lock"></i>
                    </span>
                    <input
                      name="password"
                      type="password"
                      id="password"
                      autocomplete="current-password"
                      class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white text-sm pl-10 pr-10 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                      placeholder="Enter your password"
                      required
                    />
                    <button
                      type="button"
                      id="togglePassword"
                      aria-label="Show password"
                      class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition"
                    >
                      <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                    </button>
                  </div>
                </div>

                <!-- submit -->
                <button
                  type="submit"
                  class="w-full flex items-center justify-center gap-2 rounded-lg bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm px-4 py-2.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 transition"
                >
                  <i class="fa-solid fa-right-to-bracket"></i>
                  Sign in
                </button>
              </form>

              <!-- footer link -->
              <p class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
                Don't have an account?
                <a
                  data-th-href="@{'/register'}"
                  class="font-semibold text-blue-600 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300"
                  >Create one</a
                >
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      console.log("Login page");

      // Password show/hide toggle
      (function () {
        const toggle = document.getElementById("togglePassword");
        const input = document.getElementById("password");
        const icon = document.getElementById("togglePasswordIcon");
        if (toggle && input) {
          toggle.addEventListener("click", function () {
            const isHidden = input.type === "password";
            input.type = isHidden ? "text" : "password";
            icon.classList.toggle("fa-eye", !isHidden);
            icon.classList.toggle("fa-eye-slash", isHidden);
            toggle.setAttribute(
              "aria-label",
              isHidden ? "Hide password" : "Show password"
            );
          });
        }
      })();
    </script>
  </body>
</html>
