<!DOCTYPE html>
<html
  lang="en"
  th:fragment="parent(content,title,script)"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <!-- Apply the saved theme BEFORE the page paints, so there is no
         white flash when navigating between pages in dark mode. -->
    <script>
      (function () {
        try {
          var e = document.documentElement;
          var t = localStorage.getItem("theme") || "light";
          e.classList.remove("light", "dark");
          e.classList.add(t);
          // Apply collapsed sidebar state before paint (desktop only)
          if (localStorage.getItem("sidebar-collapsed") === "1") {
            e.classList.add("sidebar-collapsed");
          }
        } catch (err) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSRF token for AJAX/fetch state-changing requests -->
    <meta name="_csrf" th:content="${_csrf?.token}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" />
    <title data-th-replace="${title}">SCM</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" data-th-href="@{'/css/output.css'}" />
    <link rel="stylesheet" data-th-href="@{'/css/style.css'}" />

    <!-- Inter font for a clean, modern type system -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      /* Root background per theme — prevents any white flash before the body
         paints and during page-to-page view transitions. Exact design tokens. */
      html {
        background-color: #eef2f6; /* soft light app bg (easy on the eyes) */
      }
      html.dark {
        background-color: #0b1220; /* dark app bg (never pure black) */
      }

      /* Reusable premium interactions */
      .hover-lift {
        transition: transform 0.2s ease, box-shadow 0.2s ease,
          border-color 0.2s ease;
      }
      .hover-lift:hover {
        transform: translateY(-2px);
      }

      /* Collapsible sidebar (desktop only — on mobile it's a drawer).
         Smoothly narrows the rail to icons and pulls the content in. */
      #logo-sidebar {
        transition: width 0.25s ease, transform 0.25s ease;
      }
      nav#app-topbar,
      main.sm\:pl-64 {
        transition: padding-left 0.25s ease;
      }
      @media (min-width: 640px) {
        html.sidebar-collapsed #logo-sidebar {
          width: 5rem;
        }
        html.sidebar-collapsed nav#app-topbar,
        html.sidebar-collapsed main.sm\:pl-64 {
          padding-left: 5rem;
        }
        html.sidebar-collapsed #logo-sidebar .nav-text {
          opacity: 0;
          width: 0;
          overflow: hidden;
          pointer-events: none;
        }
        html.sidebar-collapsed #logo-sidebar .nav-link,
        html.sidebar-collapsed #logo-sidebar .nav-user,
        html.sidebar-collapsed #logo-sidebar .nav-logout,
        html.sidebar-collapsed #logo-sidebar .nav-brand {
          justify-content: center;
        }
        html.sidebar-collapsed #logo-sidebar .nav-collapse-icon {
          transform: rotate(180deg);
        }
        html.sidebar-collapsed #logo-sidebar .nav-brand-logo {
          display: none;
        }
      }
      /* Nicer, consistent scrollbars in dark mode */
      html.dark * {
        scrollbar-color: #334155 transparent;
      }
      /* The view-transition snapshots inherit the root background, so the
         cross-fade stays dark in dark mode instead of flashing white. */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        background-color: inherit;
      }

      /* Smooth cross-page navigation (Chrome/Edge support MPA view transitions).
         Browsers without support simply navigate normally — no harm. */
      @view-transition {
        navigation: auto;
      }

      /* Keep the sidebar and top bar visually persistent across navigations so
         only the main content cross-fades. */
      #logo-sidebar {
        view-transition-name: app-sidebar;
      }
      #app-topbar {
        view-transition-name: app-topbar;
      }

      /* Cross-fade timing for the page content */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.22s;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Gentle fade-in fallback for browsers without view transitions.
         Opacity-only (no transform) so it never leaves a stacking context
         that could trap modals beneath their backdrop. */
      @keyframes scmFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        #content {
          animation: scmFadeIn 0.22s ease-out both;
        }
      }
    </style>

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="dark:bg-gray-900 bg-gray-100 dark:text-white">
    <!-- commona header -->

    <!--  user is logged in : navbar -->
    <div th:if="${loggedInUser}">
      <div data-th-replace="~{user/user_navbar::user-navbar}"></div>
    </div>

    <!-- user is not logged : navbar -->
    <div th:unless="${loggedInUser}">
      <div data-th-replace="~{navbar :: navbar}"></div>
    </div>

    <!-- main content -->
    <div class="">
      <section data-th-replace="${content}"></section>
    </div>
    <!-- flow bite content -->

    <!-- common footer -->
    <!-- <footer class="p-4">Footer: Learn Code With Durgesh</footer> -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script data-th-src="@{'/js/script.js'}"></script>
    <th:block data-th-replace="${script}"></th:block>
  </body>
</html>
